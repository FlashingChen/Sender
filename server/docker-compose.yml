services:
  sender-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DB_PATH: /data/messages.db
      TZ: Asia/Shanghai
    volumes:
      - sender-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  sender-data:
