{{define "terminal-style"}}
<style>
:root{--bg:#0A0B08;--panel:#101208;--line:#232614;--text:#E8E4D8;--dim:#9A947F;--faint:#5C574A;--amber:#E8A33D;--green:#7FB069;--red:#C05B4D}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--bg);color:var(--text);font:13.5px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC",monospace;text-wrap:pretty}a{color:var(--dim);text-decoration:none}a:hover{color:var(--amber)}.top{display:flex;align-items:center;gap:22px;padding:14px 22px;border-bottom:1px solid var(--line)}.brand{color:var(--amber);font-weight:700;letter-spacing:.05em}.brand:before{content:"$ "}.tabs{display:flex;gap:2px}.tab{padding:6px 14px;color:var(--dim);border:1px solid transparent;border-radius:4px}.tab:hover{color:var(--text)}.tab.active{color:var(--amber);border-color:var(--line);background:var(--panel)}.right{margin-left:auto;color:var(--faint)}.right a{margin-left:14px}.wrap{max-width:1080px;margin:26px auto;padding:0 22px}h1{font-size:15px;font-weight:700;color:var(--amber);margin:0 0 6px}h1:before{content:"# "}.sub{color:var(--dim);margin-bottom:20px}.notice,.error{border:1px solid var(--line);border-left:3px solid var(--amber);background:var(--panel);padding:9px 14px;margin:14px 0}.error{border-left-color:var(--red);color:#E4A79D}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}.kpi{border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:var(--panel)}.kpi .k{color:var(--faint);font-size:11px;letter-spacing:.08em}.kpi .v{font-size:22px;color:var(--text);margin-top:4px;font-variant-numeric:tabular-nums}.kpi .v b{color:var(--green);font-weight:600}.log{border:1px solid var(--line);border-radius:4px;background:var(--panel);margin-bottom:22px}.log .head{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);color:var(--faint);font-size:11px;letter-spacing:.08em}.bars{display:flex;gap:6px;align-items:flex-end;height:70px;margin:14px 14px 4px}.bars span{flex:1;background:var(--amber);opacity:.75;min-height:3px}.bars span:last-child{opacity:1}.days{display:flex;gap:6px;color:var(--faint);font-size:11px;padding:0 14px 10px}.days span{flex:1;text-align:center}.line{display:grid;grid-template-columns:150px 110px 1fr;gap:14px;padding:7px 14px;border-bottom:1px solid var(--line);align-items:baseline;min-width:0}.line:last-child{border-bottom:none}.line:hover{background:#15170d}.line .t,.line .src,.line .m{min-width:0}.line .t{color:var(--faint)}.line .src{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.line .src:before{content:"[";color:var(--faint)}.line .src:after{content:"]";color:var(--faint)}.line .m{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.line.expanded .m{white-space:pre-wrap}.line .m .who{color:var(--amber)}.line .m .who:after{content:": ";color:var(--faint)}.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}.filters input,.filters select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 10px;font:inherit;font-size:12.5px;border-radius:4px}.filters input:focus,.filters select:focus{outline:none;border-color:var(--amber)}.filters .prompt{color:var(--amber);font-size:12px}.filters input[type=text]{flex:1;min-width:200px}.pager{display:flex;justify-content:flex-end;gap:14px;padding:10px 14px;color:var(--faint);font-size:12px}.pager a{color:var(--dim)}.pager a:hover{color:var(--amber)}button{font:inherit;border-radius:4px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--text)}button.ok{background:var(--amber);border-color:var(--amber);color:#1A1204;font-weight:700}button.danger{color:var(--red);border-color:#3A2420}.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:12px 14px}.app-share{display:flex;justify-content:space-between;color:var(--dim)}.app-share b{color:var(--amber);font-weight:600}.empty{padding:18px 14px;color:var(--faint)}.standalone{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.sbox{width:100%;max-width:480px;border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:28px}.sbox h1{margin-bottom:14px}.sbrand{text-align:center;color:var(--faint);font-size:12px;margin-bottom:18px;letter-spacing:.08em}.sbrand b{color:var(--amber)}.sbox label{display:block;color:var(--faint);font-size:12px;margin:12px 0 4px}.sbox input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:9px 11px;font:inherit;border-radius:4px}.sbox input:focus{outline:none;border-color:var(--amber)}.sbox .row{display:flex;gap:10px;margin-top:20px}.sbox .row button{flex:1}.sbox .aka{color:var(--faint);font-size:11px;margin-top:16px;text-align:center}.sudo{border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:4px;background:var(--panel);padding:20px 22px;margin-bottom:16px}.sudo .who{color:var(--amber);font-weight:700}.sudo .ask{color:var(--dim);margin:10px 0 16px;line-height:1.9}.sudo .scope{color:var(--text);background:var(--bg);border:1px solid var(--line);padding:8px 12px;border-radius:4px;margin:10px 0}.sudo .scope .tag{color:var(--green)}.oobcode{border:1px solid var(--line);border-left:3px solid var(--green);border-radius:4px;background:var(--bg);padding:16px 20px;margin:14px 0;font-size:20px;letter-spacing:.1em;text-align:center;color:var(--green);word-break:break-all}.muted{color:var(--dim)}@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}.line{grid-template-columns:95px 80px 1fr;gap:8px}.top{gap:8px;padding:10px}.tabs{flex-wrap:wrap}.tab{padding:5px 8px}.right{font-size:11px}.apps{grid-template-columns:1fr}}
</style>
{{end}}
{{define "standalone-style"}}{{template "terminal-style" .}}{{end}}
{{define "terminal-nav"}}
<header class="top"><a class="brand" href="/">sender</a><nav class="tabs"><a class="tab{{if eq .Title "概览 · Sender"}} active{{end}}" href="/">概览</a><a class="tab{{if eq .Title "历史 · Sender"}} active{{end}}" href="/history">历史</a><a class="tab{{if eq .Title "绑定设备 · Sender"}} active{{end}}" href="/bind">绑定设备</a></nav><span class="right">{{.User.Username}} <a href="/logout">退出</a></span></header>
{{end}}
